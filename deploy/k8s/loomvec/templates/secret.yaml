{{- if and .Values.secret.create (not .Values.secret.existingSecret) -}}
apiVersion: v1
kind: Secret
metadata:
  name: {{ include "loomvec.secretName" . }}
  labels:
    {{- include "loomvec.labels" . | nindent 4 }}
type: Opaque
stringData:
  # LOOMVEC_AUTH__JWT_SECRET（templates/_helpers.tpl → loomvec.env）
  auth-jwt-secret: {{ .Values.secret.jwtSecret | quote }}
  # LOOMVEC_STORAGE__ACCESS_KEY / LOOMVEC_STORAGE__SECRET_KEY（内置 RustFS 凭据同源）
  storage-access-key: {{ .Values.secret.storageAccessKey | quote }}
  storage-secret-key: {{ .Values.secret.storageSecretKey | quote }}
  {{- range $k, $v := .Values.secret.stringData }}
  {{ $k }}: {{ $v | quote }}
  {{- end }}
{{- end }}
