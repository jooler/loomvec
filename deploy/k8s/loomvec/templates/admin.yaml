apiVersion: apps/v1
kind: Deployment
metadata:
  name: {{ include "loomvec.fullname" . }}-admin
  labels:
    {{- include "loomvec.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  replicas: {{ .Values.admin.replicaCount }}
  {{- with .Values.admin.strategy }}
  strategy:
    {{- include "loomvec.updateStrategy" . | nindent 4 }}
  {{- end }}
  selector:
    matchLabels:
      {{- include "loomvec.selectorLabels" . | nindent 6 }}
      app.kubernetes.io/component: admin
  template:
    metadata:
      labels:
        {{- include "loomvec.componentLabels" (dict "component" "admin" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loomvec.serviceAccountName" . }}
      containers:
        - name: admin
          image: {{ include "loomvec.image" (dict "root" $ "image" .Values.admin.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          ports:
            - name: http
              containerPort: {{ .Values.admin.port }}
          readinessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 3
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /
              port: http
            initialDelaySeconds: 10
            periodSeconds: 20
          {{- with .Values.admin.resources }}
          resources:
            {{- toYaml . | nindent 12 }}
          {{- end }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
      {{- with .Values.admin.nodeSelector }}
      nodeSelector:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.tolerations }}
      tolerations:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      {{- with .Values.admin.affinity }}
      affinity:
        {{- toYaml . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: {{ include "loomvec.fullname" . }}-admin
  labels:
    {{- include "loomvec.labels" . | nindent 4 }}
    app.kubernetes.io/component: admin
spec:
  type: ClusterIP
  ports:
    - name: http
      port: {{ .Values.admin.port }}
      targetPort: http
  selector:
    {{- include "loomvec.selectorLabels" . | nindent 4 }}
    app.kubernetes.io/component: admin
