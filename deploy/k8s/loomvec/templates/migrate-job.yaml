{{- /* pre-install / pre-upgrade 钩子：幂等初始化数据库（loomvec.api.init_db，P5 起取代 alembic） */ -}}
apiVersion: batch/v1
kind: Job
metadata:
  name: {{ include "loomvec.fullname" . }}-migrate
  labels:
    {{- include "loomvec.labels" . | nindent 4 }}
    app.kubernetes.io/component: migrate
  annotations:
    helm.sh/hook: pre-install,pre-upgrade
    helm.sh/hook-weight: "-5"
    helm.sh/hook-delete-policy: before-hook-creation
spec:
  backoffLimit: {{ .Values.migrate.backoffLimit }}
  {{- if gt (.Values.migrate.ttlSecondsAfterFinished | int) 0 }}
  ttlSecondsAfterFinished: {{ .Values.migrate.ttlSecondsAfterFinished }}
  {{- end }}
  template:
    metadata:
      labels:
        {{- include "loomvec.componentLabels" (dict "component" "migrate" "context" .) | nindent 8 }}
    spec:
      {{- with .Values.global.imagePullSecrets }}
      imagePullSecrets:
        {{- toYaml . | nindent 8 }}
      {{- end }}
      serviceAccountName: {{ include "loomvec.serviceAccountName" . }}
      restartPolicy: Never
      securityContext:
        {{- toYaml .Values.podSecurityContext | nindent 8 }}
      containers:
        - name: migrate
          image: {{ include "loomvec.image" (dict "root" $ "image" .Values.migrate.image) }}
          imagePullPolicy: {{ .Values.global.imagePullPolicy }}
          workingDir: /app/services/api
          # uv 沿目录树向上找到 /app/pyproject.toml 与 /app/.venv（--no-sync 不重装依赖）
          command: ["/bin/sh", "-c"]
          args:
            - uv run --no-sync python -m loomvec.api.init_db
          env:
            {{- include "loomvec.env" . | nindent 12 }}
          volumeMounts:
            - name: app-config
              mountPath: /etc/loomvec
              readOnly: true
        volumes:
          - name: app-config
            secret:
              secretName: {{ include "loomvec.secretName" . }}
              items:
                - key: app-config.json
                  path: app-config.json
          resources:
            {{- toYaml .Values.migrate.resources | nindent 12 }}
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop: ["ALL"]
