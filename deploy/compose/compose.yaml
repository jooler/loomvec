# LoomVec 基础设施栈（P0）
# 用法：cp .env.example .env && docker compose up -d
# 冒烟验证：uv run python scripts/smoke/run.py
name: loomvec

services:
  # ---------- PostgreSQL 18 + Apache AGE（openCypher） ----------
  postgres:
    build:
      context: ./postgres-age
      dockerfile: Dockerfile
    image: loomvec/postgres-age:18
    container_name: loomvec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-loomvec}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-loomvec}
      POSTGRES_DB: ${POSTGRES_DB:-loomvec}
    ports:
      # 宿主机端口默认 35433：本机系统 PostgreSQL 占 5432，回退到 5432 会互相混淆
      # 127.0.0.1 绑定（P5.5a F12 整改）：基础设施端口不暴露外网/局域网，
      # 也收敛 agent-sandbox 沙箱经 host-gateway 的宿主可达面
      - "127.0.0.1:${POSTGRES_PORT:-35433}:5432"
    volumes:
      - postgres_data:/var/lib/postgresql
      - ./postgres-age/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-loomvec} -d ${POSTGRES_DB:-loomvec}"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- Redis（Celery broker / 缓存 / 限流） ----------
  redis:
    image: redis:8-alpine
    container_name: loomvec-redis
    restart: unless-stopped
    ports:
      - "127.0.0.1:${REDIS_PORT:-36379}:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- RustFS（S3 兼容对象存储；同时充当 Milvus 存储后端） ----------
  rustfs:
    image: rustfs/rustfs:latest # 建议生产固定版本号（对齐 https://github.com/rustfs/rustfs releases）
    container_name: loomvec-rustfs
    restart: unless-stopped
    environment:
      RUSTFS_ACCESS_KEY: ${RUSTFS_ACCESS_KEY:-loomvec}
      RUSTFS_SECRET_KEY: ${RUSTFS_SECRET_KEY:-loomvec-secret}
      RUSTFS_VOLUMES: /data
    ports:
      - "127.0.0.1:${RUSTFS_PORT:-39000}:9000"
      - "127.0.0.1:${RUSTFS_CONSOLE_PORT:-39001}:9001"
    volumes:
      - rustfs_data:/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9000/health || exit 1"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ---------- etcd（Milvus 元数据） ----------
  etcd:
    image: quay.io/coreos/etcd:v3.5.18
    container_name: loomvec-etcd
    restart: unless-stopped
    environment:
      ETCD_AUTO_COMPACTION_MODE: revision
      ETCD_AUTO_COMPACTION_RETENTION: "1000"
      ETCD_QUOTA_BACKEND_BYTES: "4294967296"
      ETCD_SNAPSHOT_COUNT: "50000"
    command: >
      etcd
      -advertise-client-urls=http://etcd:2379
      -listen-client-urls=http://0.0.0.0:2379
      --data-dir=/etcd
    volumes:
      - etcd_data:/etcd
    healthcheck:
      test: ["CMD", "etcdctl", "endpoint", "health"]
      interval: 10s
      timeout: 5s
      retries: 20

  # ---------- Milvus 2.6 Standalone（dense + BM25 混合检索） ----------
  milvus:
    image: milvusdb/milvus:v2.6.23
    container_name: loomvec-milvus
    restart: unless-stopped
    command: ["milvus", "run", "standalone"]
    environment:
      ETCD_ENDPOINTS: etcd:2379
      # 用 RustFS 承担 Milvus 的对象存储（替代默认 MinIO）
      MINIO_ADDRESS: rustfs:9000
      MINIO_ACCESS_KEY_ID: ${RUSTFS_ACCESS_KEY:-loomvec}
      MINIO_SECRET_ACCESS_KEY: ${RUSTFS_SECRET_KEY:-loomvec-secret}
      COMMON_STORAGETYPE: remote
    ports:
      - "127.0.0.1:${MILVUS_PORT:-39530}:19530"
      - "127.0.0.1:${MILVUS_METRICS_PORT:-39091}:9091"
    volumes:
      - milvus_data:/var/lib/milvus
      # 覆盖 flushRate 等配额限制，见 milvus/user.yaml 内注释
      - ./milvus/user.yaml:/milvus/configs/user.yaml:ro
    depends_on:
      etcd:
        condition: service_healthy
      rustfs:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9091/healthz || exit 1"]
      interval: 10s
      timeout: 5s
      start_period: 60s
      retries: 30

  # ---------- MinerU 4.0（文档解析，CPU basic/flash 档位，ONNX 小模型） ----------
  # 镜像内以 PyPI 固定版本依赖安装 MinerU（版本钉在 mineru/Dockerfile 的
  # MINERU_VERSION；Apache-2.0+附加条款，见 02/13 文档合规项），源码不入库。
  # 首次启动会自动下载解析模型到 mineru_models 卷（约 1~2GB，需等待）
  mineru:
    build:
      context: ./mineru
    image: loomvec/mineru:4.0.10-cpu
    container_name: loomvec-mineru
    restart: unless-stopped
    entrypoint: ["/bin/bash", "/app/entrypoint.sh"]
    environment:
      MINERU_MODEL_SOURCE: modelscope
      MINERU_HOME: /models
      # Keep this aligned with config/loomvec.json → mineru.max_concurrency.
      # CPU deployments start conservatively; size it from measured headroom.
      MINERU_CONCURRENCY: ${MINERU_CONCURRENCY:-1}
      # ONNX intra-op threads used by each active MinerU parse job.
      MINERU_INTRA_OP_NUM_THREADS: ${MINERU_INTRA_OP_NUM_THREADS:-4}
    ports:
      - "127.0.0.1:${MINERU_PORT:-38000}:8000"
    volumes:
      - mineru_models:/models
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8000/v1/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 600s # 首次启动含模型下载
      retries: 60

  # ---------- 可选：Milvus 管理界面 ----------
  attu:
    image: zilliz/attu:v2.6
    container_name: loomvec-attu
    restart: unless-stopped
    profiles: ["debug"]
    environment:
      MILVUS_URL: milvus:19530
    ports:
      - "127.0.0.1:${ATTU_PORT:-33001}:3000"
    depends_on:
      milvus:
        condition: service_healthy

  # ---------- P4-QA-02 测试 IdP（SSO/OAuth 集成测试与本地联调） ----------
  keycloak:
    image: quay.io/keycloak/keycloak:26.0
    container_name: loomvec-keycloak
    restart: unless-stopped
    profiles: ["sso"]
    command: start-dev --import-realm
    environment:
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HEALTH_ENABLED: "true"
    volumes:
      - ./keycloak/loomvec-realm.json:/opt/keycloak/data/import/loomvec-realm.json:ro
    ports:
      - "127.0.0.1:${KEYCLOAK_PORT:-38088}:8080"

  # ---------- P4-INF-01 监控告警栈 ----------
  prometheus:
    image: prom/prometheus:v2.55.1
    container_name: loomvec-prometheus
    restart: unless-stopped
    profiles: ["observability"]
    extra_hosts:
      - "host.docker.internal:host-gateway" # api/worker 在宿主机运行，经此抓取
    volumes:
      - ../monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - ../monitoring/alerts.yml:/etc/prometheus/alerts.yml:ro
      - prometheus_data:/prometheus
    ports:
      - "127.0.0.1:${PROMETHEUS_PORT:-39090}:9090"

  alertmanager:
    image: prom/alertmanager:v0.27.0
    container_name: loomvec-alertmanager
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../monitoring/alertmanager.yml:/etc/alertmanager/alertmanager.yml:ro
    ports:
      - "127.0.0.1:${ALERTMANAGER_PORT:-39093}:9093"

  grafana:
    image: grafana/grafana:11.3.0
    container_name: loomvec-grafana
    restart: unless-stopped
    profiles: ["observability"]
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD:-admin}
    volumes:
      - ../monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ../monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana_data:/var/lib/grafana
    ports:
      - "127.0.0.1:${GRAFANA_PORT:-33002}:3000"

  loki:
    image: grafana/loki:3.4.2
    container_name: loomvec-loki
    restart: unless-stopped
    profiles: ["observability"]
    command: -config.file=/etc/loki/local-config.yaml
    volumes:
      - ../monitoring/loki.yml:/etc/loki/local-config.yaml:ro
      - loki_data:/loki
    ports:
      - "127.0.0.1:${LOKI_PORT:-33100}:3100"

  promtail:
    image: grafana/promtail:3.4.2
    container_name: loomvec-promtail
    restart: unless-stopped
    profiles: ["observability"]
    volumes:
      - ../monitoring/promtail.yml:/etc/promtail/config.yml:ro
      - /var/lib/docker/containers:/var/lib/docker/containers:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro

  # ---------- P5 智能体网关（dsh 运行时编排；应用栈 profile，dev 默认宿主机运行） ----------
  agent:
    build:
      context: ../..
      dockerfile: services/agent/Dockerfile
    image: loomvec/agent:latest
    container_name: loomvec-agent
    restart: unless-stopped
    profiles: ["app"]
    environment:
      # 变量名对齐 pydantic-settings 嵌套约定（LOOMVEC_ 前缀 + __ 分隔）：
      # agent_service.internal_token（api facade ↔ agent 内部共享密钥）
      LOOMVEC_AGENT_SERVICE__INTERNAL_TOKEN: ${LOOMVEC_AGENT_SERVICE__INTERNAL_TOKEN:-dev-internal-token}
    volumes:
      - agent_envs:/data/loomvec/agent-envs
      - ../../config:/app/config:ro
    # 容器内 dsh 回调 api 的 MCP 地址由 config/loomvec.json agent.mcp.url 提供；
    # 容器化部署时需指向 api 可达地址（如 http://host.docker.internal:38080）
    extra_hosts:
      - "host.docker.internal:host-gateway"
    ports:
      - "127.0.0.1:${AGENT_PORT:-38090}:8090"
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:8090/internal/agent/health || exit 1"]
      interval: 15s
      timeout: 5s
      start_period: 30s
      retries: 10

  # ---------- 可选：acp-gateway（智能体网关；agent.gateway.url 指向它） ----------
  # 默认不启动。生产可把网关独立部署（见 acp-gateway 仓库 deploy/compose.example.yaml），此时本服务不用，
  # 只需在 loomvec 配置 agent.gateway.url。同机一起跑：docker compose --profile gateway up -d acp-gateway
  #
  # 前置（一次性，均不会被本 compose 自动完成）：
  #  1. 镜像：acpgw/gateway、acpgw/agent-claude、acpgw/agent-dsh 三个版本固定的镜像在本机可用
  #     （当前未发布到公共仓库：在 acp-gateway 仓库按其 docs/operations.md「镜像」构建，或 docker load）；
  #     升级时同步改下面的镜像 tag 与 acp-gateway/config.json 里 agents.*.image。
  #  2. 网关库：复用本栈的 postgres / redis（127.0.0.1 发布口），网关用独立 database `acpgw`、redis db 1：
  #       docker exec loomvec-postgres psql -U "${POSTGRES_USER:-loomvec}" -d postgres -c 'CREATE DATABASE acpgw'
  #     密码含 URL 保留字符（@ : / # ?）时需手工在 ACPGW_DATABASE_URL 里做百分号编码。
  #  3. 沙箱网络与防火墙：agent 容器由网关经 docker.sock 拉起，加入 acpgw-sandbox 网络（固定子网，见文末 networks）：
  #       docker network create --subnet "${ACPGW_SANDBOX_SUBNET:-172.31.88.0/24}" acpgw-sandbox
  #     宿主默认丢弃「容器 → 宿主」入站，必须放行沙箱网段 → 宿主上的两个端口（root）：
  #       网关端口 38095（agent 回连上游代理）和 loomvec api 端口 LOOMVEC_API_PORT（agent 回调 MCP，同样走宿主 INPUT）。
  #     对 acpgw-sandbox 子网**只跑本目录的 sandbox-firewall.sh**，端口传逗号分隔列表：
  #       sudo deploy/compose/sandbox-firewall.sh "${ACPGW_SANDBOX_SUBNET:-172.31.88.0/24}" 38080,38095
  #     不要再对该子网跑 acp-gateway 仓库的 sandbox-firewall.sh：两个脚本各带一条该子网的 INPUT DROP，
  #     后跑的排在前面，会把另一个脚本放行的端口挡掉。
  #     语义差异（务必知晓）：本脚本的外网策略是 loomvec 现有的——沙箱 → 公网放行，沙箱互访 / 私网 RFC1918 /
  #     CGNAT 100.64.0.0/10 / 链路本地 169.254.0.0/16（含各云 metadata）DROP；它**不是**网关脚本的
  #     upstream-only（出站只到上游代理）。需要 upstream-only 的部署应改用网关脚本，但它的 INPUT 目前只放网关端口、
  #     没有放行 api 端口的参数，MCP 回调会被挡——这需要网关仓库先补参数，本期不涉及。
  #     脚本本身仍未在真实内核上实测；上线前按交付说明的验证清单逐项确认。
  #  4. 存储根目录 ACPGW_STORAGE_ROOT 必须是宿主上已存在、对 uid 1000（容器内 node 用户）可写的目录；
  #     它以**同一路径**同时挂进网关容器和宿主（路径恒等），agent 容器才能挂到同一份工作区。
  #  5. 密钥只走 deploy/compose/.env（已 gitignore）：ACPGW_SECRET_KEY（≥32 字符）、ACPGW_ADMIN_TOKEN、
  #     ACPGW_ANTHROPIC_API_KEY、ACPGW_DEEPSEEK_API_KEY（两个上游 key 都要给，缺的那个上游对应 agent 全部 503）。
  #     这里不用 ${VAR:?}：required 变量即使 profile 未启用也会让整个 compose 解析失败；
  #     缺 ACPGW_SECRET_KEY / ACPGW_ADMIN_TOKEN 时网关在 NODE_ENV=production 下启动即报错。
  #  6. loomvec 侧（config/loomvec.json 与 admin 设置，不在本目录）：agent.gateway.url 指向本服务
  #     （同机：http://127.0.0.1:38095）；agent.mcp.url_sandbox 必须是沙箱容器能访问到的 api 地址
  #     （同机：http://host.docker.internal:<LOOMVEC_API_PORT>/api/v1/mcp；deploy.sh 只在启用旧沙箱时才写它，需自行确认），
  #     其端口必须在第 3 条的防火墙端口列表里，其主机还要加入网关租户的 settings.mcp.allowed_hosts；
  #     agent.gateway.api_key / admin_token 在 admin 里填。
  #
  # 拓扑：network_mode: host（网关与宿主共享网络命名空间，防火墙脚本的 INPUT 规则才覆盖得到沙箱 → 网关；
  # 监听 :38095，api 在宿主上直接用 127.0.0.1:38095 访问，沙箱经 host-gateway 访问）。因为是 host 网络，
  # 本服务不能 ports 映射，也不能和 api 共用 compose 网络，api（宿主进程）与网关互访都走回环。
  acp-gateway:
    image: ${ACPGW_GATEWAY_IMAGE:-acpgw/gateway:0.1.0}
    container_name: loomvec-acp-gateway
    restart: unless-stopped
    profiles: ["gateway"]
    network_mode: host
    environment:
      NODE_ENV: production
      ACPGW_CONFIG: /etc/acp-gateway/config.json
      ACPGW_DATABASE_URL: ${ACPGW_DATABASE_URL:-postgres://${POSTGRES_USER:-loomvec}:${POSTGRES_PASSWORD:-loomvec}@127.0.0.1:${POSTGRES_PORT:-35433}/acpgw}
      ACPGW_REDIS_URL: ${ACPGW_REDIS_URL:-redis://127.0.0.1:${REDIS_PORT:-36379}/1}
      ACPGW_SECRET_KEY: ${ACPGW_SECRET_KEY:-}
      ACPGW_ADMIN_TOKEN: ${ACPGW_ADMIN_TOKEN:-}
      ACPGW_ANTHROPIC_API_KEY: ${ACPGW_ANTHROPIC_API_KEY:-}
      ACPGW_DEEPSEEK_API_KEY: ${ACPGW_DEEPSEEK_API_KEY:-}
    volumes:
      - ${ACPGW_CONFIG_FILE:-./acp-gateway/config.json}:/etc/acp-gateway/config.json:ro
      - /var/run/docker.sock:/var/run/docker.sock
      # 路径恒等；config.json 的 storage_root 必须与此一致
      - ${ACPGW_STORAGE_ROOT:-/data/acp-gateway}:${ACPGW_STORAGE_ROOT:-/data/acp-gateway}
    group_add:
      - "${DOCKER_GID:-999}" # 宿主 docker 组 gid：stat -c %g /var/run/docker.sock
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy

volumes:
  postgres_data:
  redis_data:
  rustfs_data:
  etcd_data:
  milvus_data:
  mineru_models:
  prometheus_data:
  grafana_data:
  loki_data:
  agent_envs:

networks:
  # P5.5a 沙箱专用 bridge（docs/Research/01 §6.5）：固定子网供 sandbox-firewall.sh
  # 引用；api/其他 compose 服务一律不加入该网络。compose 栈不引用它（沙箱容器
  # 由网关经 docker run 按名接入），deploy.sh/dev.sh 以 docker network create 幂等保底。
  agent-sandbox:
    name: agent-sandbox
    driver: bridge
    ipam:
      config:
        - subnet: ${AGENT_SANDBOX_SUBNET:-172.31.77.0/24}

  # acp-gateway 的 agent 沙箱网络（同 agent-sandbox：compose 栈不引用，仅作子网单源参考；
  # 由 docker network create 预先创建，防火墙脚本按该子网下发）。网关 config.json 的
  # runtime.docker.network 必须与 name 一致
  acpgw-sandbox:
    name: acpgw-sandbox
    driver: bridge
    ipam:
      config:
        - subnet: ${ACPGW_SANDBOX_SUBNET:-172.31.88.0/24}
