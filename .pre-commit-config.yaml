repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v5.0.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
        exclude: ^third_party/
      - id: check-added-large-files
        exclude: ^third_party/
      - id: check-merge-conflict
  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.9.6
    hooks:
      - id: ruff
        args: [--fix]
      - id: ruff-format
  - repo: https://github.com/pre-commit/mirrors-prettier
    rev: v3.1.0
    hooks:
      - id: prettier
        types_or: [ts, tsx, javascript, jsx, css, json, yaml, markdown]
        exclude: ^(third_party|pnpm-lock\.yaml|apps/web/src/sdk|apps/admin/src/sdk|packages/sdk-ts/src)/
